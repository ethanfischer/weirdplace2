[/Script/Engine.DeviceProfileManager]
+DeviceProfileNameAndTypes=(Name="SteamDeck",DeviceType="Linux")

[Windows DeviceProfile]
; Dev / low-end PC: use cheap Screen Space reflections instead of Lumen reflections.
; Keeps full Lumen GI (the project's look) — only specular reflections change.
; ~+16fps on a GTX 1070 (reflections cost ~2.5ms/frame). PS5 has no override here,
; so it inherits the project default r.ReflectionMethod=1 (Lumen) and ships full-quality.
+CVars=r.ReflectionMethod=2

[SteamDeck DeviceProfile]
BaseProfileName=Linux
DeviceType=Linux
+CVars=sg.ResolutionQuality=75
+CVars=sg.ViewDistanceQuality=0
+CVars=sg.AntiAliasingQuality=2
+CVars=sg.ShadowQuality=1
+CVars=sg.GlobalIlluminationQuality=2
+CVars=sg.ReflectionQuality=1
; Steam Deck is even weaker than the dev 1070 — use Screen Space reflections (keeps Lumen GI).
+CVars=r.ReflectionMethod=2
+CVars=sg.PostProcessQuality=2
+CVars=sg.TextureQuality=2
+CVars=sg.EffectsQuality=2
+CVars=sg.FoliageQuality=2
+CVars=sg.ShadingQuality=2
+CVars=t.MaxFPS=30
